<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High or Low</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: radial-gradient(ellipse at top, #193c42 0%, #111 58%);
    }
    .machine-page {
      width: min(100%, 580px);
      text-align: center;
    }
    .machine-page .game-links {
      margin: 0 0 2rem;
      align-items: flex-start;
    }
    .machine {
      padding: clamp(1.25rem, 5vw, 2.5rem);
      border: 1px solid #3d7472;
      border-radius: 12px;
      background: #172323;
      box-shadow: 0 18px 60px #0008;
    }
    .machine h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 8vw, 3rem);
    }
    .machine-intro {
      margin: 0 0 2rem;
      color: #c2d0cb;
    }
    .bet-label {
      display: block;
      margin-bottom: 0.5rem;
      color: #d8e4de;
      font-weight: bold;
      text-align: left;
    }
    #bet-amount {
      box-sizing: border-box;
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid #52716d;
      border-radius: 6px;
      background: #0f1717;
      color: #fff;
      font: inherit;
      font-size: 1.1rem;
    }
    #bet-amount:focus {
      border-color: #00ccaa;
      outline: 2px solid #00ccaa55;
    }
    .range-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .range-button {
      min-height: 4rem;
      border: 2px solid #00ccaa;
      border-radius: 6px;
      background: #00ccaa;
      color: #10201e;
      cursor: pointer;
      font: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      transition: background 0.15s, transform 0.15s;
    }
    .range-button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #79f0d6;
    }
    .range-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    .result {
      min-height: 5rem;
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background: #0f1717;
      color: #d8e4de;
      line-height: 1.5;
    }
    .result[data-state="win"] { color: #79f0b0; }
    .result[data-state="loss"] { color: #ff9c8c; }
    .result[data-state="error"] { color: #ffcc7a; }
    @media (max-width: 380px) {
      body { padding: 1rem; }
      .range-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="machine-page">
    <div class="game-links">
      <a class="game-button" href="../index.html">Home</a>
    </div>
    <section class="machine" aria-labelledby="machine-title">
      <h1 id="machine-title">High or Low</h1>
      <p class="machine-intro">Pick a range and double your bet if you guess right.</p>
      <label class="bet-label" for="bet-amount">Your bet</label>
      <input id="bet-amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Enter an amount">
      <div class="range-buttons" aria-label="Choose a number range">
        <button class="range-button" type="button" data-min="1" data-max="3">1-3</button>
        <button class="range-button" type="button" data-min="4" data-max="6">4-6</button>
      </div>
      <div class="result" id="game-result" role="status" aria-live="polite">Enter your bet, then choose a range.</div>
    </section>
  </main>
  <script src="highorlow.js"></script>
</body>
</html>
